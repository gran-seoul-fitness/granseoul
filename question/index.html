    background-position:center top;
    background-attachment:fixed;

    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    color:var(--ink);
  }


  /* ---------- Card shell ---------- */
  .card{
    max-width:420px;width:100%;
    border-radius:24px;overflow:hidden;
    background:var(--ivory);
    border:1px solid rgba(28,28,26,0.08);
    box-shadow:0 30px 70px rgba(60,45,25,0.18);
  }
  .card-header{
    padding:30px 30px 22px;
    background:var(--paper2);
    border-bottom:2px solid rgba(216,90,48,0.16);
    position:relative;
  }
  .card-header::after{
    content:'';position:absolute;left:30px;right:30px;bottom:-2px;height:2px;
    background:linear-gradient(90deg,var(--gold),transparent);
  }
  .issue-tag{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;
    color:var(--ivory-light);background:var(--orange);
    padding:4px 10px;border-radius:20px;margin-bottom:10px;
  }
  .brand-sub{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:6px;font-weight:700;}
  .brand-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:0.3px;}
  .brand-title span{color:var(--orange);}

  .card-body{padding:30px;}
  .screen{display:none;animation:screenFadeIn .5s ease;}
  .screen.active{display:block;}
  @keyframes screenFadeIn{
    0%{opacity:0;transform:translateY(6px);}
    100%{opacity:1;transform:translateY(0);}
  }

  .q-title{font-size:18px;font-weight:700;color:var(--ink);line-height:1.6;margin-bottom:12px;}
  .q-desc{font-size:13px;font-weight:400;color:var(--ink-soft);line-height:1.85;margin-bottom:24px;}
  .q-desc strong{color:var(--orange);font-weight:700;}

  label{display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;}
  .field{margin-bottom:16px;}
  input[type="text"], textarea{
    width:100%;background:#FBF9F4;
    border:1px solid rgba(28,28,26,0.14);
    border-radius:12px;padding:13px 16px;
    font-family:'HoonminjeongeumH','Gowun Batang',serif;
    font-size:14px;color:var(--ink);
    resize:none;
    transition:border-color .15s ease;
  }
  input[type="text"]::placeholder, textarea::placeholder{color:#B4AFA2;}
  input[type="text"]:focus, textarea:focus{outline:none;border-color:var(--orange);}
  textarea{min-height:110px;}
  .optional-tag{color:#B4AFA2;font-weight:400;text-transform:none;letter-spacing:0;}

  .btn-start{
    width:100%;color:#FBF9F4;background:var(--orange);border:none;border-radius:12px;
    padding:15px;box-shadow:0 4px 14px rgba(216,90,48,0.35);
    font-family:'HoonminjeongeumH','Gowun Batang',serif;
    font-size:14px;font-weight:700;letter-spacing:0.3px;
    cursor:pointer;margin-top:6px;transition:transform .12s ease;
  }
  .btn-start:active{transform:scale(0.98);}
  .btn-start:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}

  /* ---------- Success screen ---------- */
  .success-screen{padding:12px 0 4px;text-align:center;}
  .char-stamp{width:132px;margin:0 auto 16px;position:relative;}
  .char-stamp svg{width:100%;display:block;animation:charIdle 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 16px rgba(28,28,26,0.18));}
  @keyframes charIdle{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-7px) rotate(-2deg);}
  }
  .sparkle{position:absolute;font-size:16px;color:var(--gold);animation:sparklePop 1.8s ease-in-out infinite;}
  .sparkle.s1{top:-6px;left:-4px;animation-delay:.1s;}
  .sparkle.s2{top:10px;right:-10px;animation-delay:.5s;}
  .sparkle.s3{bottom:6px;left:6px;animation-delay:.9s;}
  @keyframes sparklePop{
    0%,100%{opacity:0;transform:scale(.5);}
    50%{opacity:1;transform:scale(1.1);}
  }
  .success-title{font-size:18px;font-weight:700;color:var(--ink);margin-bottom:12px;line-height:1.6;}
  .success-desc{font-size:13px;font-weight:400;color:var(--ink-soft);line-height:1.85;}

  .footer-note{
    padding:16px 30px 22px;text-align:center;
    font-size:10.5px;font-weight:400;color:#B4AFA2;
    border-top:1px solid rgba(28,28,26,0.06);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="issue-tag">10월 · 03호</div>
    <div class="brand-sub">그랑서울 피트니스</div>
    <div class="brand-title">웰니스 <span>레터</span></div>
  </div>

  <div id="formScreen" class="card-body screen active">
    <div class="q-title">궁금했던 내용이 있으신가요?</div>
    <div class="q-desc">
      운동을 하시면서, 혹은 내 몸에 대해 평소 궁금했던 점을
      편하게 남겨주세요. <strong>다음 호 주제</strong>에 참고하겠습니다.
    </div>

    <form id="questionForm">
      <div class="field">
        <label>성함 <span class="optional-tag">(선택)</span></label>
        <input type="text" id="nameInput" placeholder="입력하지 않아도 됩니다">
      </div>
      <div class="field">
        <label>궁금한 내용</label>
        <textarea id="contentInput" placeholder="예: 앉아있을 때 다리를 꼬면 정말 안 좋은가요?" required></textarea>
      </div>
      <button type="submit" class="btn-start" id="submitBtn">보내기</button>
    </form>
  </div>

  <div id="successScreen" class="card-body screen success-screen">
    <div class="char-stamp">
      <span class="sparkle s1">✦</span>
      <span class="sparkle s2">✧</span>
      <span class="sparkle s3">✦</span>
      <svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="skinGradGirl" cx="38%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF3E4"/><stop offset="55%" stop-color="#FFDDB0"/><stop offset="100%" stop-color="#F2C48C"/>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywp0lF9kWDiSI0GcfiqFS5EOQ0R8nXZ76mVnvSKnTPcQTEWtQDO0lAEdbKbbAyNFl7bQ/exec";

  document.getElementById('questionForm').addEventListener('submit', function(e){
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    if (!content) return;

    // 화면은 클릭 즉시 감사 화면으로 전환
    document.getElementById('formScreen').classList.remove('active');
    document.getElementById('successScreen').classList.add('active');

    // 실제 전송은 뒤에서 조용히 진행 (사용자는 기다릴 필요 없음)
    const payload = new URLSearchParams({
      action: 'question',
      name: name || '익명',
      content: content,
      timestamp: new Date().toISOString()
    });

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: payload.toString()
    }).catch(function() {
      // 실패해도 사용자 화면에는 영향 없음 (이미 감사 화면을 보여준 뒤라 재전송 유도는 하지 않음)
    });
  });
</script>
