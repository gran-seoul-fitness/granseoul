<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>궁금한 내용을 알려주세요 | Gran Seoul Fitness</title>
<style>
  @font-face{ font-family:'NanumSquare'; src:url('/fonts/NanumSquareL.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('/fonts/NanumSquareR.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('/fonts/NanumSquareB.woff2') format('woff2'); font-weight:700; font-display:swap; }
  @font-face{ font-family:'NanumSquare'; src:url('/fonts/NanumSquareEB.woff2') format('woff2'); font-weight:800; font-display:swap; }

  :root{
    --bg-deep:#101718;
    --bg-panel:#1a2224;
    --bg-panel-2:#212b2d;
    --mint:#3EE3C7;
    --mint-soft:#8FF4E1;
    --ember:#FF6B4A;
    --text:#F2F6F5;
    --muted:#829894;
    --muted2:#7E9591;
    --line: rgba(62,227,199,0.16);
    --locked:#2a3436;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'NanumSquare', sans-serif;
    font-weight: 400;
    background:
      radial-gradient(circle at 18% 8%, rgba(62,227,199,0.08), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(255,107,74,0.06), transparent 40%),
      var(--bg-deep);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    max-width: 420px;
    width: 100%;
    border-radius: 26px;
    overflow: hidden;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }

  .card-header {
    padding: 30px 30px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .brand-sub { font-size: 10px; letter-spacing: 3px; color: var(--mint); text-transform: uppercase; margin-bottom: 6px; font-weight: 800; }
  .brand-title { font-family: 'NanumSquare', sans-serif; font-size: 19px; font-weight: 800; color: var(--text); letter-spacing: 0.3px; }
  .brand-title span { color: var(--mint); }

  .card-body { padding: 30px; }
  .q-title { font-size: 18px; font-weight: 800; color: var(--text); line-height: 1.55; margin-bottom: 12px; }
  .q-desc { font-size: 13px; font-weight: 300; color: var(--muted2); line-height: 1.8; margin-bottom: 26px; }
  .q-desc strong { color: var(--mint-soft); font-weight: 700; }

  label { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: 1px; color: var(--mint-soft); text-transform: uppercase; margin-bottom: 8px; }
  .field { margin-bottom: 18px; }
  input[type="text"], textarea {
    width: 100%;
    background: var(--bg-panel-2);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 13px 16px;
    font-family: 'NanumSquare', sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: var(--text);
    resize: none;
    transition: border-color .15s ease;
  }
  input[type="text"]::placeholder, textarea::placeholder { color: var(--muted); }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--mint); }
  textarea { min-height: 110px; }
  .optional-tag { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--mint), #22B79E);
    color: #0a1211;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-family: 'NanumSquare', sans-serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.3px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 8px 24px rgba(62,227,199,0.25);
    transition: transform 0.12s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

  .success-screen { display: none; padding: 44px 30px; text-align: center; }

  /* ===== 캐릭터 마스코트 ===== */
  .char-stamp { width: 84px; height: 98px; margin: 0 auto 14px; }
  .char-stamp svg { width: 100%; height: 100%; display: block; animation: charIdle 2.6s ease-in-out infinite; }
  @keyframes charIdle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-7px) rotate(-2deg); }
  }
  .success-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 12px; line-height: 1.55; }
  .success-desc { font-size: 13px; font-weight: 300; color: var(--muted2); line-height: 1.8; }

  .footer-note {
    padding: 16px 30px 22px;
    text-align: center;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.05);
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="brand-sub">Gran Seoul Fitness</div>
    <div class="brand-title">Wellness <span>Letter</span></div>
  </div>

  <div id="formScreen" class="card-body">
    <div class="q-title">궁금했던 내용이 있으신가요?</div>
    <div class="q-desc">
      운동을 하시면서, 혹은 내 몸에 대해 평소 궁금했던 점을
      편하게 남겨주세요. <strong>다음 호 주제</strong>에 참고하겠습니다.
    </div>

    <form id="questionForm">
      <div class="field">
        <label>성함 <span class="optional-tag">(선택)</span></label>
        <input type="text" id="nameInput" placeholder="입력하지 않아도 됩니다">
      </div>
      <div class="field">
        <label>궁금한 내용</label>
        <textarea id="contentInput" placeholder="예: 앉아있을 때 다리를 꼬면 정말 안 좋은가요?" required></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">보내기</button>
    </form>
  </div>

  <div id="successScreen" class="success-screen">
    <div class="char-stamp">
      <svg viewBox="0 0 120 150">
        <defs>
          <radialGradient id="sealBodyQ" cx="35%" cy="28%" r="78%">
            <stop offset="0%" stop-color="#FBFEFE"/><stop offset="100%" stop-color="#D6E8E9"/>
          </radialGradient>
        </defs>
        <ellipse cx="46" cy="130" rx="9" ry="6" fill="url(#sealBodyQ)"/>
        <ellipse cx="74" cy="130" rx="9" ry="6" fill="url(#sealBodyQ)"/>
        <ellipse cx="60" cy="106" rx="25" ry="19" fill="url(#sealBodyQ)"/>
        <ellipse cx="28" cy="99" rx="13" ry="8" fill="url(#sealBodyQ)" transform="rotate(25 28 99)"/>
        <ellipse cx="92" cy="96" rx="13" ry="8" fill="url(#sealBodyQ)" transform="rotate(-25 92 96)"/>
        <circle cx="60" cy="56" r="40" fill="url(#sealBodyQ)"/>
        <ellipse cx="46" cy="72" rx="7" ry="4.5" fill="#FFC9C0" opacity="0.55"/>
        <ellipse cx="74" cy="72" rx="7" ry="4.5" fill="#FFC9C0" opacity="0.55"/>
        <rect x="38" y="42" width="13" height="4" rx="2" fill="#20302E" transform="rotate(-12 44 44)"/>
        <rect x="69" y="42" width="13" height="4" rx="2" fill="#20302E" transform="rotate(12 76 44)"/>
        <circle cx="46" cy="58" r="5" fill="#20302E"/>
        <circle cx="74" cy="58" r="5" fill="#20302E"/>
        <circle cx="44.5" cy="56.5" r="1.6" fill="#fff"/>
        <circle cx="72.5" cy="56.5" r="1.6" fill="#fff"/>
        <circle cx="60" cy="67" r="5" fill="#20302E"/>
        <path d="M50,74 Q55,80 60,74 Q65,80 70,74" stroke="#20302E" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g transform="translate(96 92) rotate(18)">
          <ellipse cx="0" cy="0" rx="9" ry="5" fill="#7FC7D9"/>
          <path d="M-9,0 L-15,-4 L-15,4 Z" fill="#7FC7D9"/>
        </g>
      </svg>
    </div>
    <div class="success-title">소중한 의견 감사합니다</div>
    <div class="success-desc">
      남겨주신 내용은 다음 Wellness Letter 주제 선정에<br>
      참고하겠습니다. 감사합니다.
    </div>
  </div>

  <div class="footer-note">Gran Seoul Fitness × Wellness Letter</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywp0lF9kWDiSI0GcfiqFS5EOQ0R8nXZ76mVnvSKnTPcQTEWtQDO0lAEdbKbbAyNFl7bQ/exec";

  document.getElementById('questionForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('nameInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    if (!content) return;

    // 화면은 클릭 즉시 감사 화면으로 전환
    document.getElementById('formScreen').style.display = 'none';
    document.getElementById('successScreen').style.display = 'block';

    // 실제 전송은 뒤에서 조용히 진행 (사용자는 기다릴 필요 없음)
    const payload = new URLSearchParams({
      action: 'question',
      name: name || '익명',
      content: content,
      timestamp: new Date().toISOString()
    });

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: payload.toString()
    }).catch(function() {
      // 실패해도 사용자 화면에는 영향 없음 (이미 감사 화면을 보여준 뒤라 재전송 유도는 하지 않음)
    });
  });
</script>

</body>
</html>
